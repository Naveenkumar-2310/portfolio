<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Hexagonal Pill Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Glowing Corner Status Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="2" fill="#ffffff"/>

  <!-- Futuristic Monogram NK -->
  <g fill="none" stroke="url(#auroraGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Letter N -->
    <path d="M16 46V18L30 46V18" />
    <!-- Letter K -->
    <path d="M38 18V46" />
    <path d="M49 20L38 33L49 46" />
  </g>
</svg>

